[project]
name = "sephora-business-insight-api"
version = "0.2.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]  # S = bandit security rules

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are how pytest works
